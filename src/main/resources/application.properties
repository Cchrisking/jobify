spring.application.name=jobify
server.port=9080

# Local runs use the 'dev' profile (application-dev.properties). Deployments must set
# SPRING_PROFILES_ACTIVE to something else and provide JWT_SECRET, otherwise startup fails.
spring.profiles.default=dev

# JWT — Base64 key of at least 256 bits, e.g. `openssl rand -base64 32`
jwt.secret=${JWT_SECRET:}
jwt.expiration=86400000

cors.allowed-origins=http://localhost:3000,http://localhost:3001

# Datasource — file-based H2 for dev (persists between restarts)
spring.datasource.url=jdbc:h2:file:./data/jobifydb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# File storage — resumes are written to <upload.dir>/<username>_resume/
app.upload.dir=./data/uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
