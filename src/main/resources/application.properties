spring.application.name=jobify
server.port=9080

# JWT — replace secret with a securely generated 256-bit Base64 key before deploying
jwt.secret=am9iaWZ5LXNlY3VyaXR5LWp3dC1rZXktcGxlYXNlLWNoYW5nZS1tZQ==
jwt.expiration=86400000

cors.allowed-origins=http://localhost:3000

# Datasource — file-based H2 for dev (persists between restarts)
spring.datasource.url=jdbc:h2:file:./data/jobifydb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
